<template>
    ---json
    {
    "templating": {
    "extends": "templates/layouts/content.html"
    }
    }
    ---
    [% template styles %]
    <link rel="stylesheet" href="[[ $context-path ]]/resources/css/landing_page.css"/>
    [% endtemplate %]
    
    <div class="rrp-landing">
        <div class="rrp-content-middle">
            <div class="rrp-content-middle-inner">
                <section class="rrp-hero">
                    <h1>RRP <span class="rrp-hero-separator">|</span> Reading the Sources</h1>
                    <p>A digital portal for the study of 16th-century Latin commentaries on the Pauline epistles.</p>
                </section>
                
                <div class="rrp-cards-row rrp-cards-row--top">
                    <a class="rrp-card" href="[[ $context-path ]]/browse.html">
                        <div class="rrp-card-image">
                            <!-- Remplacer par : <img src="[[ $context-path ]]/resources/images/search.jpg" alt="" style="width:100%; height:100%; object-fit:cover;"/> -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </div>
                        <div class="rrp-card-body">
                            <h3>Search in the corpus</h3>
                            <p>Explore the commentaries by keyword, author, or reference.</p>
                        </div>
                    </a>
                    <a class="rrp-card" href="[[ $context-path ]]/Daneau_1-Tim_C1-6?view=div&amp;odd=PaulCom">
                        <div class="rrp-card-image">
                            <!-- Remplacer par : <img src="[[ $context-path ]]/resources/images/read.jpg" alt="" style="width:100%; height:100%; object-fit:cover;"/> -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path d="M2 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-7a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h8z"/></svg>
                        </div>
                        <div class="rrp-card-body">
                            <h3>Read the sources</h3>
                            <p>Browse commentaries in their original transcription, alongside the facsimile.</p>
                        </div>
                    </a>
                    <a class="rrp-card" href="https://ihr-num.unige.ch/rrp/" target="_blank" rel="noopener">
                        <div class="rrp-card-image">
                            <!-- Remplacer par : <img src="[[ $context-path ]]/resources/images/main-database.jpg" alt="" style="width:100%; height:100%; object-fit:cover;"/> -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4.03 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/></svg>
                        </div>
                        <div class="rrp-card-body">
                            <h3>RRP | Reformation Readings of Paul</h3>
                            <p>A bibliographic database of 16th century commentaries on Paul</p>
                        </div>
                    </a>
                </div>
                
                <div class="rrp-cards-row rrp-cards-row--bottom">
                    <a class="rrp-card" href="[[ $context-path ]]/framework.html">
                        <div class="rrp-card-image">
                            <!-- Remplacer par : <img src="[[ $context-path ]]/resources/images/framework.jpg" alt="" style="width:100%; height:100%; object-fit:cover;"/> -->
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </div>
                        <div class="rrp-card-body">
                            <h3>Digital framework</h3>
                            <p>Learn more about the project's methodology, encoding, and tools.</p>
                        </div>
                    </a>
                    <a class="rrp-card" href="[[ $context-path ]]/about.html">
                        <div class="rrp-card-image">
                            <!-- Remplacer par : <img src="[[ $context-path ]]/resources/images/about.jpg" alt="" style="width:100%; height:100%; object-fit:cover;"/> -->
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="10" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="7.8" r="1.5"/><rect x="10.7" y="10.8" width="2.6" height="7.2" rx="1.3"/></svg>
                        </div>
                        <div class="rrp-card-body">
                            <h3>About</h3>
                            <p>Project background, team, and acknowledgements.</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
        
        <div class="rrp-frieze-divider"/>
        
        <footer class="rrp-credits">
            <section id="credits">
                <p><strong>Terms of Use and Citation </strong>The citation terms are as follows :
                    RRP | Reading the Sources, website for 16th Century Exegesis of Paul,
                    SNF207696, Universties of Geneva and Zürich, dir. Ueli Zahnd and Stefan Krauter, [date
                    of consultation]". </p>
                <p><strong>coding &amp; design</strong> :<a href="mailto:floriane.goy@ik.me">floriane.goy@ik.me</a></p>
            </section>
        </footer>
        
        <div class="rrp-partners">
            <img src="[[ $context-path ]]/resources/images/SNF_blanc.png" alt="Fonds national suisse"/>
            <img src="[[ $context-path ]]/resources/images/IHR_blanc.png" alt="Institut d'Histoire de la Réformation, Genève" class="rrp-logo-large"/>
            <img src="[[ $context-path ]]/resources/images/UZH_blanc.png" alt="Universität Zürich"/>
        </div>
    </div>
    <!-- Easter egg temporairement retiré pour test -->
</template>
